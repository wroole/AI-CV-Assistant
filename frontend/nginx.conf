server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Local LLM (Ollama) analysis can take several minutes: the first
        # request cold-loads a multi-GB model into VRAM, and HR mode
        # (CV + job description) generates a long JSON response. 120s was
        # too short — nginx returned 504 with an empty body, which the
        # frontend rendered as an error / "no statistics". 600s covers it.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
